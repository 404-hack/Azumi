<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Location Test - Azumi</title>
		<style>
			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
				max-width: 800px;
				margin: 0 auto;
				padding: 20px;
				line-height: 1.6;
				background: #f8fafc;
			}
			.container {
				background: white;
				padding: 30px;
				border-radius: 12px;
				box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
			}
			.btn {
				background: #3b82f6;
				color: white;
				border: none;
				padding: 12px 24px;
				border-radius: 8px;
				cursor: pointer;
				font-size: 16px;
				margin: 8px;
				transition: background-color 0.2s;
			}
			.btn:hover {
				background: #2563eb;
			}
			.btn:disabled {
				background: #9ca3af;
				cursor: not-allowed;
			}
			.info-box {
				background: #f0f9ff;
				border: 1px solid #0ea5e9;
				border-radius: 8px;
				padding: 16px;
				margin: 16px 0;
			}
			.error-box {
				background: #fef2f2;
				border: 1px solid #ef4444;
				border-radius: 8px;
				padding: 16px;
				margin: 16px 0;
			}
			.success-box {
				background: #f0fdf4;
				border: 1px solid #22c55e;
				border-radius: 8px;
				padding: 16px;
				margin: 16px 0;
			}
			.coords {
				background: #f3f4f6;
				padding: 12px;
				border-radius: 6px;
				font-family: 'Monaco', 'Consolas', monospace;
				margin: 8px 0;
			}
			.loading {
				display: inline-block;
				animation: spin 1s linear infinite;
			}
			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>🌍 Location Test Tool</h1>
			<p>
				This tool helps diagnose GPS coordinate accuracy issues. Use this to test different location
				methods.
			</p>

			<div id="status"></div>

			<div style="margin: 20px 0">
				<button class="btn" onclick="testHighAccuracy()">📍 Test High Accuracy GPS</button>
				<button class="btn" onclick="testLowAccuracy()">🌐 Test Network Location</button>
				<button class="btn" onclick="testCachedLocation()">💾 Test Cached Location</button>
				<button class="btn" onclick="clearResults()">🗑️ Clear Results</button>
			</div>

			<div id="results"></div>
		</div>

		<script>
			let resultCounter = 0;

			function showStatus(message, type = 'info') {
				const statusDiv = document.getElementById('status');
				const className =
					type === 'error' ? 'error-box' : type === 'success' ? 'success-box' : 'info-box';
				statusDiv.innerHTML = `<div class="${className}">${message}</div>`;
			}

			function addResult(title, data) {
				const resultsDiv = document.getElementById('results');
				resultCounter++;

				const resultHtml = `
                <div class="info-box">
                    <h3>${resultCounter}. ${title}</h3>
                    <div class="coords">
                        <strong>Coordinates:</strong> ${data.coords.latitude}, ${data.coords.longitude}<br>
                        <strong>Accuracy:</strong> ${data.coords.accuracy}m<br>
                        <strong>Timestamp:</strong> ${new Date(data.timestamp).toLocaleString()}<br>
                        <strong>Method:</strong> ${data.method}
                    </div>
                    ${data.address ? `<p><strong>Address:</strong> ${data.address}</p>` : ''}
                    ${data.error ? `<div class="error-box">Error: ${data.error}</div>` : ''}
                </div>
            `;

				resultsDiv.innerHTML = resultHtml + resultsDiv.innerHTML;
			}

			async function testHighAccuracy() {
				showStatus('🔍 Getting high accuracy GPS location... <span class="loading">⟳</span>');

				try {
					const position = await getCurrentPosition({
						enableHighAccuracy: true,
						timeout: 15000,
						maximumAge: 0
					});

					const address = await reverseGeocode(position.coords.latitude, position.coords.longitude);

					addResult('High Accuracy GPS', {
						...position,
						method: 'GPS with high accuracy',
						address: address
					});

					showStatus('✅ High accuracy location obtained successfully!', 'success');
				} catch (error) {
					showStatus(`❌ High accuracy GPS failed: ${error.message}`, 'error');
					addResult('High Accuracy GPS (Failed)', {
						coords: { latitude: 0, longitude: 0, accuracy: 0 },
						timestamp: Date.now(),
						method: 'GPS with high accuracy',
						error: error.message
					});
				}
			}

			async function testLowAccuracy() {
				showStatus('📶 Getting network-based location... <span class="loading">⟳</span>');

				try {
					const position = await getCurrentPosition({
						enableHighAccuracy: false,
						timeout: 10000,
						maximumAge: 300000
					});

					const address = await reverseGeocode(position.coords.latitude, position.coords.longitude);

					addResult('Network Location', {
						...position,
						method: 'Network/WiFi based',
						address: address
					});

					showStatus('✅ Network location obtained successfully!', 'success');
				} catch (error) {
					showStatus(`❌ Network location failed: ${error.message}`, 'error');
					addResult('Network Location (Failed)', {
						coords: { latitude: 0, longitude: 0, accuracy: 0 },
						timestamp: Date.now(),
						method: 'Network/WiFi based',
						error: error.message
					});
				}
			}

			async function testCachedLocation() {
				showStatus('💾 Getting cached location... <span class="loading">⟳</span>');

				try {
					const position = await getCurrentPosition({
						enableHighAccuracy: true,
						timeout: 5000,
						maximumAge: 600000
					});

					const address = await reverseGeocode(position.coords.latitude, position.coords.longitude);

					addResult('Cached Location', {
						...position,
						method: 'Cached (up to 10 min old)',
						address: address
					});

					showStatus('✅ Cached location obtained successfully!', 'success');
				} catch (error) {
					showStatus(`❌ Cached location failed: ${error.message}`, 'error');
					addResult('Cached Location (Failed)', {
						coords: { latitude: 0, longitude: 0, accuracy: 0 },
						timestamp: Date.now(),
						method: 'Cached (up to 10 min old)',
						error: error.message
					});
				}
			}

			function clearResults() {
				document.getElementById('results').innerHTML = '';
				document.getElementById('status').innerHTML = '';
				resultCounter = 0;
			}

			function getCurrentPosition(options) {
				return new Promise((resolve, reject) => {
					if (!navigator.geolocation) {
						reject(new Error('Geolocation is not supported by your browser'));
						return;
					}

					navigator.geolocation.getCurrentPosition(resolve, reject, options);
				});
			}

			async function reverseGeocode(latitude, longitude) {
				try {
					const response = await fetch(
						`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&addressdetails=1&zoom=18&accept-language=en`,
						{
							headers: {
								'User-Agent': 'Azumi-LocationTest/1.0'
							}
						}
					);

					if (!response.ok) {
						throw new Error(`Geocoding service error: ${response.status}`);
					}

					const data = await response.json();
					return data.display_name || 'Unknown location';
				} catch (error) {
					return `Reverse geocoding failed: ${error.message}`;
				}
			}

			showStatus('Ready to test location services. Click a button above to start.');
		</script>
	</body>
</html>
