<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Enhanced GPS Accuracy Test</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<style>
			.accuracy-excellent {
				color: #10b981;
			}
			.accuracy-high {
				color: #3b82f6;
			}
			.accuracy-good {
				color: #f59e0b;
			}
			.accuracy-moderate {
				color: #f97316;
			}
			.accuracy-low {
				color: #ef4444;
			}

			.pulse {
				animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
			}

			@keyframes pulse {
				0%,
				100% {
					opacity: 1;
				}
				50% {
					opacity: 0.5;
				}
			}
		</style>
	</head>
	<body class="bg-gray-50 p-4">
		<div class="mx-auto max-w-2xl">
			<div class="rounded-lg bg-white p-6 shadow-lg">
				<h1 class="mb-6 text-center text-2xl font-bold text-gray-800">
					🌍 Enhanced GPS Accuracy Test
				</h1>

				<div class="space-y-4">
					<button
						id="basicGPS"
						class="w-full rounded-lg bg-blue-500 px-6 py-3 font-semibold text-white transition hover:bg-blue-600"
					>
						📍 Basic GPS Test
					</button>

					<button
						id="enhancedGPS"
						class="w-full rounded-lg bg-green-500 px-6 py-3 font-semibold text-white transition hover:bg-green-600"
					>
						🎯 Enhanced GPS Test (Multiple Attempts)
					</button>

					<button
						id="clearResults"
						class="w-full rounded-lg bg-gray-500 px-4 py-2 font-semibold text-white transition hover:bg-gray-600"
					>
						🗑️ Clear Results
					</button>
				</div>

				<div id="loading" class="hidden py-4 text-center">
					<div
						class="inline-block h-8 w-8 animate-spin rounded-full border-b-2 border-blue-500"
					></div>
					<p class="mt-2 text-gray-600">Getting location...</p>
					<div id="progressText" class="mt-1 text-sm text-gray-500"></div>
				</div>

				<div id="results" class="mt-6 space-y-4"></div>
			</div>
		</div>

		<script>
			const API_KEY = 'AIzaSyBnwJ5OoYCwcPqn4aqLYDN0gCpvdRjnbv0'; // Your Google API key

			let resultCounter = 0;

			function addResult(title, data, isError = false) {
				resultCounter++;
				const resultsDiv = document.getElementById('results');
				const resultDiv = document.createElement('div');
				resultDiv.className = `border rounded-lg p-4 ${isError ? 'border-red-300 bg-red-50' : 'border-gray-300 bg-white'}`;

				const timestamp = new Date().toLocaleTimeString();

				if (isError) {
					resultDiv.innerHTML = `
                    <div class="flex items-start justify-between">
                        <h3 class="font-semibold text-red-700">${resultCounter}. ${title}</h3>
                        <span class="text-xs text-gray-500">${timestamp}</span>
                    </div>
                    <p class="text-red-600 mt-2">${data}</p>
                `;
				} else {
					const accuracyClass = getAccuracyClass(data.accuracy);
					const accuracyMessage = getAccuracyMessage(data.accuracy);

					resultDiv.innerHTML = `
                    <div class="flex items-start justify-between">
                        <h3 class="font-semibold text-gray-800">${resultCounter}. ${title}</h3>
                        <span class="text-xs text-gray-500">${timestamp}</span>
                    </div>
                    <div class="mt-3 space-y-2">
                        <div class="grid grid-cols-2 gap-4 text-sm">
                            <div>
                                <span class="font-medium">Latitude:</span>
                                <span class="ml-1 font-mono">${data.latitude.toFixed(6)}</span>
                            </div>
                            <div>
                                <span class="font-medium">Longitude:</span>
                                <span class="ml-1 font-mono">${data.longitude.toFixed(6)}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="font-medium">Accuracy:</span>
                            <span class="${accuracyClass} font-semibold">${Math.round(data.accuracy)}m</span>
                        </div>
                        <div class="text-sm ${accuracyClass}">
                            ${accuracyMessage}
                        </div>
                        ${data.address ? `<div class="text-sm text-gray-600 mt-2"><strong>Address:</strong> ${data.address}</div>` : ''}
                        ${data.attempts ? `<div class="text-xs text-gray-500 mt-1">Attempts: ${data.attempts}</div>` : ''}
                    </div>
                `;
				}

				resultsDiv.appendChild(resultDiv);
				resultDiv.scrollIntoView({ behavior: 'smooth' });
			}

			function getAccuracyClass(accuracy) {
				if (accuracy <= 10) return 'accuracy-excellent';
				if (accuracy <= 25) return 'accuracy-high';
				if (accuracy <= 50) return 'accuracy-good';
				if (accuracy <= 100) return 'accuracy-moderate';
				return 'accuracy-low';
			}

			function getAccuracyMessage(accuracy) {
				if (accuracy <= 5) return '🎯 Excellent accuracy - Perfect for delivery!';
				if (accuracy <= 10) return '✅ High accuracy - Great location precision';
				if (accuracy <= 25) return '👍 Good accuracy - Suitable for most purposes';
				if (accuracy <= 50) return '⚠️ Moderate accuracy - Consider moving to open area';
				if (accuracy <= 100) return '🔄 Low accuracy - Try moving outdoors';
				return '📍 Very low accuracy - GPS signal is weak';
			}

			function showLoading(show, text = '') {
				const loading = document.getElementById('loading');
				const progressText = document.getElementById('progressText');

				if (show) {
					loading.classList.remove('hidden');
					progressText.textContent = text;
				} else {
					loading.classList.add('hidden');
					progressText.textContent = '';
				}
			}

			function updateProgress(text) {
				const progressText = document.getElementById('progressText');
				progressText.textContent = text;
			}

			// Basic GPS Test
			function basicGPSTest() {
				showLoading(true, 'Getting location with basic GPS...');

				const options = {
					enableHighAccuracy: true,
					timeout: 15000,
					maximumAge: 0
				};

				navigator.geolocation.getCurrentPosition(
					async (position) => {
						const coords = position.coords;
						const data = {
							latitude: coords.latitude,
							longitude: coords.longitude,
							accuracy: coords.accuracy || 0,
							attempts: 1
						};

						// Try to get address
						try {
							updateProgress('Getting address...');
							const address = await reverseGeocode(coords.latitude, coords.longitude);
							data.address = address;
						} catch (e) {
							console.warn('Failed to get address:', e);
						}

						showLoading(false);
						addResult('Basic GPS', data);
					},
					(error) => {
						showLoading(false);
						addResult('Basic GPS Failed', error.message, true);
					},
					options
				);
			}

			// Enhanced GPS Test with multiple attempts
			function enhancedGPSTest() {
				showLoading(true, 'Starting enhanced GPS test...');

				let bestPosition = null;
				let attempts = 0;
				const maxAttempts = 3;

				function attemptGeolocation(useHighAccuracy, maxAge) {
					attempts++;
					updateProgress(
						`GPS attempt ${attempts}/${maxAttempts} (highAccuracy: ${useHighAccuracy})`
					);

					const options = {
						enableHighAccuracy: useHighAccuracy,
						timeout: 8000,
						maximumAge: maxAge
					};

					navigator.geolocation.getCurrentPosition(
						(position) => {
							const coords = position.coords;
							const accuracy = coords.accuracy || Infinity;

							console.log(`GPS reading ${attempts}: accuracy=${accuracy}m`);

							if (!bestPosition || accuracy < bestPosition.accuracy) {
								bestPosition = {
									latitude: coords.latitude,
									longitude: coords.longitude,
									accuracy: accuracy,
									attempts: attempts
								};

								updateProgress(`New best accuracy: ${Math.round(accuracy)}m`);

								// If we got excellent accuracy, return immediately
								if (accuracy <= 10) {
									finalizeResult();
									return;
								}
							}

							// Continue with next attempt or finalize
							if (attempts >= maxAttempts) {
								finalizeResult();
							} else {
								setTimeout(() => tryNextApproach(), 1000);
							}
						},
						(error) => {
							console.warn(`GPS attempt ${attempts} failed:`, error);

							if (attempts >= maxAttempts) {
								if (bestPosition) {
									finalizeResult();
								} else {
									showLoading(false);
									addResult('Enhanced GPS Failed', error.message, true);
								}
							} else {
								setTimeout(() => tryNextApproach(), 1000);
							}
						},
						options
					);
				}

				function tryNextApproach() {
					if (attempts === 1) {
						// Second attempt: high accuracy, no cache
						attemptGeolocation(true, 0);
					} else if (attempts === 2) {
						// Third attempt: lower accuracy but faster
						attemptGeolocation(false, 5000);
					}
				}

				async function finalizeResult() {
					if (!bestPosition) return;

					// Try to get address
					try {
						updateProgress('Getting address...');
						const address = await reverseGeocode(bestPosition.latitude, bestPosition.longitude);
						bestPosition.address = address;
					} catch (e) {
						console.warn('Failed to get address:', e);
					}

					showLoading(false);
					addResult('Enhanced GPS', bestPosition);
				}

				// Start with first attempt
				attemptGeolocation(true, 0);
			}

			async function reverseGeocode(latitude, longitude) {
				try {
					const response = await fetch(
						`https://maps.googleapis.com/maps/api/geocode/json?latlng=${latitude},${longitude}&key=${API_KEY}&language=en`
					);

					if (!response.ok) throw new Error('Geocoding failed');

					const data = await response.json();

					if (data.status === 'OK' && data.results && data.results.length > 0) {
						return data.results[0].formatted_address;
					}

					throw new Error('No address found');
				} catch (error) {
					// Fallback to OpenStreetMap
					try {
						const response = await fetch(
							`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&addressdetails=1`,
							{ headers: { 'User-Agent': 'GPS-Test/1.0' } }
						);

						const data = await response.json();
						return data.display_name || 'Address not found';
					} catch (e) {
						return 'Address lookup failed';
					}
				}
			}

			// Event listeners
			document.getElementById('basicGPS').addEventListener('click', basicGPSTest);
			document.getElementById('enhancedGPS').addEventListener('click', enhancedGPSTest);
			document.getElementById('clearResults').addEventListener('click', () => {
				document.getElementById('results').innerHTML = '';
				resultCounter = 0;
			});

			// Check if geolocation is supported
			if (!navigator.geolocation) {
				addResult('Browser Check', 'Geolocation is not supported by this browser', true);
			} else {
				addResult('Browser Check', 'Geolocation is supported ✅');
			}
		</script>
	</body>
</html>
