<!doctype html>
<html>
	<head>
		<title>Google Maps API Key Test</title>
		<style>
			#map {
				height: 400px;
				width: 100%;
			}
		</style>
	</head>
	<body>
		<h1>Google Maps API Key Test</h1>
		<p>If your API key is working and correctly configured, you should see a map below.</p>
		<div id="map"></div>
		<p id="status">Loading map...</p>

		<script>
			let map;
			const apiKey = 'AIzaSyAMRJRN4_FxUnfexQrDDFfeic88ecNdGx8'; // We'll replace this

			function initMap() {
				if (!document.getElementById('map')) {
					document.getElementById('status').textContent = 'Error: Map container not found.';
					return;
				}
				if (typeof google === 'undefined' || typeof google.maps === 'undefined') {
					document.getElementById('status').textContent = 'Error: Google Maps API not loaded.';
					return;
				}
				try {
					map = new google.maps.Map(document.getElementById('map'), {
						center: { lat: -34.397, lng: 150.644 },
						zoom: 8
					});
					document.getElementById('status').textContent = 'Map loaded successfully!';
					console.log('Map loaded successfully in test page!');
				} catch (e) {
					document.getElementById('status').textContent = 'Error initializing map: ' + e.message;
					console.error('Error initializing map in test page:', e);
				}
			}

			function loadMapsScript() {
				if (!apiKey || apiKey === 'AIzaSyAMRJRN4_FxUnfexQrDDFfeivc88ecNdGx8') {
					document.getElementById('status').textContent =
						'Error: API Key not replaced in test script.';
					console.error('API Key placeholder not replaced.');
					return;
				}
				const script = document.createElement('script');
				script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&callback=initMap`;
				script.async = true;
				script.defer = true;
				script.onerror = () => {
					document.getElementById('status').textContent =
						'Error: Failed to load Google Maps script. Check network and API key restrictions in Google Cloud Console.';
					console.error('Failed to load Google Maps script.');
				};
				document.head.appendChild(script);
			}

			// Wait for the DOM to be ready before trying to load the script
			document.addEventListener('DOMContentLoaded', () => {
				// Manually replace this with your actual API key for this test
				// For example: const apiKey = "AIzaSy...";
				// IMPORTANT: Do not commit your actual API key to version control.
				// This is just for a quick local test.
				if (apiKey === '{{PUBLIC_GOOGLE_MAP_API_KEY_REPLACE_ME}}') {
					document.getElementById('status').textContent =
						'PENDING: Manually insert your API Key into map-test.html script section and save, then refresh.';
					console.warn(
						'API Key needs to be manually inserted into map-test.html for this test to run.'
					);
				} else {
					loadMapsScript();
				}
			});
		</script>
	</body>
</html>
